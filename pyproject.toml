[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "operator-geometry"
version = "1.0.0"
description = "Reproducible fitted-operator geometry analysis for human iEEG and scalp EEG brain-state discrimination"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Phillip Peterkin", email = "peterkin.phillip@gmail.com" },
]
keywords = [
  "neuroscience",
  "operator-geometry",
  "vector-autoregression",
  "eigenvalue-geometry",
  "iEEG",
  "EEG",
  "sleep",
  "anesthesia",
  "reproducibility",
]
dependencies = [
  "mne>=1.6",
  "numpy>=1.24",
  "scipy>=1.11",
  "pandas>=2.0",
  "powerlaw>=1.5",
  "antropy>=0.1.6",
  "neurokit2>=0.2",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "h5py>=3.9",
  "pyyaml>=6.0",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Phillip-Peterkin/Eigenvalue-and-eigenvector-geometry"
Repository = "https://github.com/Phillip-Peterkin/Eigenvalue-and-eigenvector-geometry"
Documentation = "https://github.com/Phillip-Peterkin/Eigenvalue-and-eigenvector-geometry/blob/main/TECHNICAL_REVIEW_GUIDE.md"

[tool.setuptools.packages.find]
where = ["code/analysis_pipeline"]
include = ["cmcc*"]

[tool.pytest.ini_options]
testpaths = ["tests", "code/analysis_pipeline/tests"]
pythonpath = ["code/analysis_pipeline"]
addopts = "-ra"
filterwarnings = [
  "default::UserWarning",
  "default::FutureWarning",
  "default::DeprecationWarning",
  "error::RuntimeWarning",
  "ignore:Precision loss occurred in moment calculation due to catastrophic cancellation.*:RuntimeWarning",
  "ignore:Mean of empty slice:RuntimeWarning",
  "ignore:An input array is constant.*:RuntimeWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["code/analysis_pipeline", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
