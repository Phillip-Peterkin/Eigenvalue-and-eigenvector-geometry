name: One-shot engineering review hardening

on:
  push:
    branches: [engineering-review-hardening-2026-08]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: engineering-review-hardening-2026-08
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply manuscript and documentation patch
        run: python tools/bu_review_hardening.py

      - name: Install portable environment
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Write Linux/Python 3.11 reproducibility snapshot
        run: |
          mkdir -p requirements
          {
            echo '# Reference environment snapshot generated by GitHub Actions'
            echo '# Platform: ubuntu-latest; Python 3.11'
            echo '# This is a reproducibility snapshot, not a cross-platform lock contract.'
            python -m pip freeze | grep -v '^-e ' | sort
          } > requirements/py311-linux-snapshot.txt

      - name: Remove one-shot machinery
        run: git rm .github/workflows/one-shot-engineering-hardening.yml tools/bu_review_hardening.py

      - name: Commit hardened source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Align manuscript and add reproducibility snapshot for technical review'
          git push origin HEAD:engineering-review-hardening-2026-08
