name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with development extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Ruff lint package, tests, and canonical public runners
        run: |
          ruff check \
            code/analysis_pipeline/cmcc \
            tests \
            code/analysis_pipeline/scripts/run_all_subjects_broadband_canonical.py \
            code/analysis_pipeline/scripts/analysis/_geometry_brain_states.py

      - name: Run portable test suite
        run: python -m pytest -q --tb=short

      - name: Build distributable wheel
        if: matrix.python-version == '3.11'
        run: python -m pip wheel . --no-deps -w dist
